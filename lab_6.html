<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        svg {
            border: 1px solid #ccc;
            margin-top: 20px;
            background-color: white; 
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>



<svg width="800" height="600" viewBox="-4 -4 10 8" xmlns="http://www.w3.org/2000/svg">

<rect x="-4" y="-4" width="10" height="8" fill="white" />

<g transform="scale(1, -1)">

<circle cx="1.5" cy="2.5" r="0.5" stroke='black' stroke-width='0.04' fill="blue">
    <animateTransform 
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 1.5 2.5"
        to="360 1.5 2.5"
        dur="4s"
        repeatCount="indefinite"/>
</circle>
<circle cx="4.5" cy="2.5" r="0.5" stroke='black' stroke-width='0.04' fill="blue">
    <animateTransform 
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 4.5 2.5"
        to="-360 4.5 2.5"
        dur="4s"
        repeatCount="indefinite"/>
</circle>

<rect x="0" y="1" width="1" height="1" stroke='black' stroke-width='0.04' fill="blue">
    <animate 
        attributeName="fill"
        values="blue; red; blue"
        keyTimes="0; 0.5; 1"
        dur="3s"
        repeatCount="indefinite"/>
</rect>
<rect x="5" y="1" width="1" height="1" stroke='black' stroke-width='0.04' fill="blue">
    <animate 
        attributeName="fill"
        values="blue; red; blue"
        keyTimes="0; 0.5; 1"
        dur="3s"
        repeatCount="indefinite"/>
</rect>

<ellipse id="arc-path" cx="3" cy="1" rx="2" ry="1" stroke='black' stroke-width='0.04' fill="blue">
    <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0 0"
        to="0 0.5" 
        dur="2s"
        additive="sum"
        repeatCount="indefinite"
        keyTimes="0; 0.5; 1"
        values="0 0; 0 0.5; 0 0"/>
</ellipse>

<rect x="1" y="-2" width="1" height="1" stroke='black' stroke-width='0.04' fill="blue">
    <animate 
        attributeName="height"
        values="1; 1.5; 1"
        keyTimes="0; 0.5; 1"
        dur="2s"
        repeatCount="indefinite"/>
    <animate 
        attributeName="y"
        values="-2; -2.5; -2"
        keyTimes="0; 0.5; 1"
        dur="2s"
        repeatCount="indefinite"/>
</rect>

<rect x="4" y="-2" width="1" height="1" stroke='black' stroke-width='0.04' fill="blue">
    <animate 
        attributeName="height"
        values="1; 1.5; 1"
        keyTimes="0; 0.5; 1"
        dur="2s"
        repeatCount="indefinite"/>
    <animate 
        attributeName="y"
        values="-2; -2.5; -2"
        keyTimes="0; 0.5; 1"
        dur="2s"
        repeatCount="indefinite"/>
</rect>

<rect x="2" y="-1" width="2" height="1" stroke='black' stroke-width='0.04' fill="blue"/>



<g stroke="black" stroke-width="0.05">
<line x1="-3.5" y1="0" x2="5.5" y2="0" />
<polyline points="5.5,0 5.3,-0.1 5.5,0 5.3,0.1" stroke-linejoin="round" stroke-linecap="round" />
<line x1="0" y1="-3.5" x2="0" y2="3" />
<polyline points="0,3 -0.1,2.8 0,3 0.1,2.8" stroke-linejoin="round" stroke-linecap="round" />

<line x1="-3" y1="-0.1" x2="-3" y2="0.1" />
<line x1="-2" y1="-0.1" x2="-2" y2="0.1" />
<line x1="-1" y1="-0.1" x2="-1" y2="0.1" />
<line x1="1" y1="-0.1" x2="1" y2="0.1" />
<line x1="2" y1="-0.1" x2="2" y2="0.1" />
<line x1="3" y1="-0.1" x2="3" y2="0.1" />
<line x1="4" y1="-0.1" x2="4" y2="0.1" />
<line x1="5" y1="-0.1" x2="5" y2="0.1" />
<line x1="-0.1" y1="-3" x2="0.1" y2="-3" />
<line x1="-0.1" y1="-2" x2="0.1" y2="-2" />
<line x1="-0.1" y1="-1" x2="0.1" y2="-1" />
<line x1="-0.1" y1="1" x2="0.1" y2="1" />
<line x1="-0.1" y1="2" x2="0.1" y2="2" />
</g>

<g fill="black" font-size="0.3" text-anchor="middle" dominant-baseline="central" style="font-family: Arial, sans-serif;">
<text x="5.8" y="0" transform="scale(1, -1)">X</text>
<text x="0" y="-3.3" transform="scale(1, -1)">Y</text>

<text x="-3" y="0.4" transform="scale(1, -1)">-3</text>
<text x="-2" y="0.4" transform="scale(1, -1)">-2</text>
<text x="-1" y="0.4" transform="scale(1, -1)">-1</text>
<text x="0" y="0.4" transform="scale(1, -1)">0</text>
<text x="1" y="0.4" transform="scale(1, -1)">1</text>
<text x="2" y="0.4" transform="scale(1, -1)">2</text>
<text x="3" y="0.4" transform="scale(1, -1)">3</text>
<text x="4" y="0.4" transform="scale(1, -1)">4</text>
<text x="5" y="0.4" transform="scale(1, -1)">5</text>

<text x="-0.3" y="-3" transform="scale(1, -1)">-3</text>
<text x="-0.3" y="-2" transform="scale(1, -1)">-2</text>
<text x="-0.3" y="-1" transform="scale(1, -1)">-1</text>
<text x="-0.3" y="1" transform="scale(1, -1)">1</text>
<text x="-0.3" y="2" transform="scale(1, -1)">2</text>
</g>

<g stroke="black" stroke-width="0.05">
<line x1="-2.1" y1="0" x2="-1.9" y2="0" />
<line x1="-2" y1="-0.1" x2="-2" y2="0.1" />
<line x1="0.9" y1="0" x2="1.1" y2="0" />
<line x1="1" y1="-0.1" x2="1" y2="0.1" />
</g>

</g>
</svg>

</body>
</html>
