<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Медіа Бібліотека</title>
    <style>
        body {
            font-family: 'Times New Roman', serif; 
            background-color: #f4f1ea;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            background-color: #2c3e50; 
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        
        /* Плеєр і список */
        .player-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .media-column {
            flex: 1;
            min-width: 300px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .playlist button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px;
            margin-top: 5px;
            background: #fff;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
        }
        .playlist button:hover {
            background: #f3e5f5;
            border-color: #8e44ad;
            padding-left: 20px; /* Ефект зсуву при наведенні */
        }
    </style>
</head>
<body>

    <header>
        <h1>Моя Медіа Бібліотека</h1>
    </header>

    <section id="media-content">
        <h2>Медіа Плеєр</h2>
        
        <div class="player-container">
            
            <div class="media-column">
                <h3>Відеотека</h3>
                <video id="mainVideo" controls width="100%" poster="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217" style="background: black; border-radius: 8px;">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Ваш браузер не підтримує відео.
                </video>

                <div class="playlist">
                    <p><strong>Оберіть відео:</strong></p>
                    <button type="button" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">🐰 Big Buck Bunny</button>
                    <button type="button" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">🐘 Elephant's Dream</button>
                    <button type="button" onclick="playVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">🤖 Tears of Steel</button>
                </div>
            </div>

            <div class="media-column">
                <h3>Аудіотека: Lana Del Rey</h3>
                
                <audio id="mainAudio" controls style="width: 100%; margin-bottom: 10px;">
                    <source src="lana1.mp3" type="audio/mpeg">
                    Ваш браузер не підтримує аудіо.
                </audio>

                <div class="playlist">
                    <p><strong>Оберіть пісню:</strong></p>
                    
                    <button type="button" onclick="playAudio('lana1.mp3')">
                        🥀 Summertime Sadness
                    </button>
                    
                    <button type="button" onclick="playAudio('lana2.mp3')">
                        🎮 Video Games
                    </button>
                    
                    <button type="button" onclick="playAudio('lana3.mp3')">
                        🇺🇸 Born To Die
                    </button>
                </div>
                
                
            </div>

        </div>
    </section>

    <script>
        function playVideo(videoUrl) {
            var videoPlayer = document.getElementById('mainVideo');
            videoPlayer.src = videoUrl;
            videoPlayer.play();
        }

        function playAudio(audioUrl) {
            var audioPlayer = document.getElementById('mainAudio');
            
        

            audioPlayer.src = audioUrl;
            audioPlayer.play();
        }
    </script>

</body>
</html>
